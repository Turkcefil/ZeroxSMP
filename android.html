<!doctype html>
<html lang="tr">

<body class="landing">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

      <form class="waitlist" id="waitlistForm">
        <input id="waitlistContact" type="text" placeholder="E-posta veya telefon" required>
        <button class="btn btn-primary" type="submit">Beni Haberdar Et</button>
        <p class="form-note" id="waitlistNote"></p>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/landing.js"></script>
